<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Daniel Stanciu portfolio</title>
  <meta name="description" content="Games, music and XR software by Daniel Stanciu.">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#0f3471" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f2f0e6" media="(prefers-color-scheme: light)">

  <meta property="og:title" content="Daniel Stanciu portfolio">
  <meta property="og:description" content="Games, music and XR software">
  <meta property="og:type" content="website">

  <link rel="icon" href="favicon.svg" type="image/svg+xml">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=a8dcc843">

  <script src="fx.js?v=24e39399" defer></script>
  <script src="nav.js?v=65b36cda" defer></script>
  <script src="app.js?v=66e8c4ad" defer></script>
</head>
<body>
  <a class="skip" href="#work">Skip to work</a>

  <main id="top" class="page">
    <!-- Stays put on desktop while the projects scroll beside it -->
    <aside class="page-side" aria-label="Introduction">
      <section class="hero">
        <canvas class="field" id="field" aria-hidden="true"></canvas>
        <div class="hero-inner">
          <p class="kicker mono"><span class="cursor" aria-hidden="true"></span>Portfolio</p>
          <h1><a href="./" class="home" data-home>Daniel Stanciu</a></h1>
          <span class="dim" aria-hidden="true"></span>
          <p class="lede" id="tagline">Games, AR, music and educational software</p>
        </div>
      </section>

      <nav class="side-nav mono" aria-label="Sections">
        <a href="#work" data-section="work"><span class="side-nav-line" aria-hidden="true"></span>Work</a>
        <a href="#about" data-section="about"><span class="side-nav-line" aria-hidden="true"></span>About</a>
      </nav>

      <!-- Email and links, from the editor's Site tab -->
      <div class="side-contact mono" id="side-contact"></div>
    </aside>

    <div class="page-main">
      <section id="work" class="section" aria-labelledby="work-title">
        <header class="section-head">
          <span class="section-num mono">A</span>
          <h2 id="work-title">Work</h2>
        </header>

        <!-- The filters stick to the top while the projects scroll under
             them, and leave with the last row -->
        <div class="work-list">
          <div class="toolbar mono" id="toolbar">
            <div class="filters" id="filters" role="group" aria-label="Filter by category"></div>
          </div>

          <ol class="projects" id="projects"></ol>
        </div>
        <noscript><p class="placeholder">The project index needs JavaScript.</p></noscript>
      </section>

      <section id="about" class="section" aria-labelledby="about-title">
        <header class="section-head">
          <span class="section-num mono">B</span>
          <h2 id="about-title">About</h2>
          <button type="button" class="to-top" data-to-top aria-label="Back to the top">
            <svg viewBox="0 0 10 10" aria-hidden="true"><path d="M2 5l3-3 3 3M2 8.5l3-3 3 3"/></svg>
          </button>
        </header>
        <div class="about-body" id="about-body">
          <p class="placeholder">TODO: short bio — what you do, where you've worked, what you're into. Add it in the editor (npm run edit).</p>
        </div>
      </section>
    </div>
  </main>
</body>
</html>
