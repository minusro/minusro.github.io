<p>Opening the CV… If nothing happens, <a href="Daniel-Stanciu-CV.pdf">open the PDF</a>.</p>
<!-- Count the visit on the CV's own GoatCounter site (no cookies, nothing
     stored on the device; local previews aren't counted), then go to the PDF.
     count() sends a beacon, which survives the navigation. If the counter is
     blocked or slow, go to the PDF anyway. -->
<script>
(function(){
  var done=false;
  window.go=function(){
    if(done)return;done=true;
    try{window.goatcounter&&window.goatcounter.count&&window.goatcounter.count()}catch(e){}
    location.replace('Daniel-Stanciu-CV.pdf');
  };
  setTimeout(go,1500);
})();
</script>
<script data-goatcounter="https://danielstanciu-cv.goatcounter.com/count"
        data-goatcounter-settings='{"no_onload":true}'
        async src="https://gc.zgo.at/count.js" onload="go()" onerror="go()"></script>
</body></html>
